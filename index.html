#home{padding:28px clamp(16px,4vw,56px) 40px;max-width:1280px;margin:0 auto}
.top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.mascot{width:clamp(90px,11vw,132px);aspect-ratio:1;flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.title{flex:1 1 380px;min-width:0}
.title h1{margin:0;font-weight:700;font-size:clamp(30px,5.2vw,60px);line-height:1.22;padding:.06em 0 .04em;letter-spacing:0;
  background:linear-gradient(90deg,#fff,#BFD0FF 55%,var(--crystal));-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{margin:8px 0 0;color:var(--mute);font-size:clamp(15px,1.7vw,19px);max-width:46ch}
.pilot{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:230px}
.pilot label{font-size:14px;color:var(--mute)}
.pilot input{font:inherit;font-size:18px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:100%}
.pilot .tot{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.tot svg{width:22px;height:22px}
#tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:30px}
.tier{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(0,0,10,.35)}
.tier::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--tc)}
.tier-easy{--tc:var(--mint)} .tier-medium{--tc:var(--amber)} .tier-hard{--tc:var(--pink)}
.tier h2{margin:6px 0 0;font-size:26px;font-weight:700;line-height:1.15}
.chip{display:inline-flex;align-self:flex-start;font-weight:600;font-size:14px;color:#07123A;background:var(--tc);padding:2px 14px;border-radius:999px}
.tier p{margin:0;color:var(--mute);font-size:15px}
.skills{font-size:14px;color:var(--ink);opacity:.9}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-top:6px}
.lvl{border:2px solid var(--line);background:rgba(255,255,255,.06);border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,border-color .12s,background .12s}
.lvl:hover{transform:translateY(-3px);border-color:var(--tc);background:rgba(255,255,255,.12)}
.lvl .n{font-size:24px;font-weight:700;line-height:1.1}
.lvl .s{display:flex;gap:1px}
.lvl .s svg{width:15px;height:15px}
.st-on{fill:var(--crystal);stroke:#B88700}
.st-off{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.25)}
.foot{margin-top:26px;color:var(--mute);font-size:14px;text-align:center}

/* ---------- หน้าเล่น ---------- */
#play{display:flex;flex-direction:column;height:100vh;min-height:0;padding:10px clamp(10px,1.6vw,22px) 14px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;padding:9px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);transition:transform .1s,background .1s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.16);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{padding:9px 11px}
.bar h2{margin:0;font-size:clamp(18px,2.2vw,26px);font-weight:700;flex:1 1 200px;min-width:0}
.bar .chip{font-size:13px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(340px,.88fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:0;min-width:0;display:flex;flex-direction:column}
.boardcard{padding:12px 14px 14px;gap:10px}
.info{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border-radius:999px;padding:3px 12px;font-weight:600}
.pill svg{width:18px;height:18px}
#msg{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-height:64px}
#msg .face{width:40px;height:40px;flex:none}
#msg .tx{flex:1;min-width:0;font-size:16px}
#msg.ok{border-color:var(--mint);background:rgba(51,240,176,.12)}
#msg.bad{border-color:var(--pink);background:rgba(255,92,154,.14)}
#msg.warn{border-color:var(--amber);background:rgba(255,185,56,.12)}
#msg .act{margin-top:6px;font-size:14px;padding:4px 12px}
#boardHost{flex:1;min-height:220px;position:relative;border-radius:18px;background:rgba(4,7,34,.5);border:1px solid var(--line);overflow:hidden}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;--cell:48px;gap:0;user-select:none}
.cell{width:var(--cell);height:var(--cell);position:relative;padding:calc(var(--cell)*.05)}
.cell.floor::before{content:"";position:absolute;inset:2px;border-radius:calc(var(--cell)*.2);background:rgba(130,150,255,.14);border:1px solid rgba(170,190,255,.2)}
.cell.floor.alt::before{background:rgba(130,150,255,.2)}
.cell.start::before{background:radial-gradient(circle,rgba(51,240,176,.35),rgba(130,150,255,.14) 70%);border-color:rgba(51,240,176,.6)}
.cell>svg,.cell>.cry,.cell>.goal{position:relative}
.cell.wall{padding:calc(var(--cell)*.02)}
.cry{display:block;width:100%;height:100%;filter:drop-shadow(0 0 calc(var(--cell)*.14) rgba(255,228,92,.9));animation:glow 1.8s ease-in-out infinite alternate;padding:calc(var(--cell)*.1)}
@keyframes glow{from{transform:scale(.92)}to{transform:scale(1.04)}}
.cry.got{animation:pop .45s ease-out forwards}
@keyframes pop{0%{transform:scale(1);opacity:1}40%{transform:scale(1.6);opacity:1}100%{transform:scale(2.2) translateY(-30%);opacity:0}}
.goal{filter:drop-shadow(0 0 calc(var(--cell)*.12) rgba(255,92,154,.8))}
.goal.launch{animation:launch 1.1s ease-in forwards}
@keyframes launch{to{transform:translateY(-320%) scale(1.2);opacity:0}}
.holesvg{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#robot,.rbt{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);z-index:5;transition:transform var(--dur,.25s) cubic-bezier(.4,.1,.3,1);pointer-events:none}
#robot.noanim,#robot.noanim .dirwrap,.rbt.noanim,.rbt.noanim .dirwrap{transition:none!important}
.dirwrap{position:absolute;inset:0;transition:transform var(--dur,.25s) ease}
.dirwrap{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px var(--mint))}
.dir{position:absolute;left:50%;top:-8%;width:calc(var(--cell)*.46);height:calc(var(--cell)*.34);margin-left:calc(var(--cell)*-.23);
  background:linear-gradient(180deg,#B8FFE5,#33F0B0);clip-path:polygon(50% 0,100% 100%,50% 70%,0 100%);animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-14%)}}
.rbody{position:absolute;inset:calc(var(--cell)*.1);animation:idle 2.2s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4%)}}
.rbody.bump{animation:bump .4s ease-out}
@keyframes bump{30%{transform:translate(var(--bx),var(--by)) rotate(-8deg)}60%{transform:translate(calc(var(--bx)*-.3),calc(var(--by)*-.3)) rotate(8deg)}100%{transform:none}}
.rbody.fall{animation:fall .7s ease-in forwards}
@keyframes fall{to{transform:scale(0) rotate(540deg);opacity:0}}
.rbody.hop{animation:hop .6s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-35%) scale(1.1)}}
.rbody.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}

/* ---------- แผงโปรแกรม ---------- */
.codecard{padding:12px;gap:10px}
.sec{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sec small{font-weight:400;color:var(--mute);font-size:13px}
#palette{display:flex;flex-wrap:wrap;gap:8px}
.tool{display:inline-flex;align-items:center;gap:7px;border:none;font-weight:600;font-size:16px;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.3);cursor:grab;transition:transform .08s,filter .08s}
.tool:hover:not(.off){transform:translateY(-2px);filter:brightness(1.08)}
.tool:active{cursor:grabbing}
.tool.off{opacity:.4;cursor:not-allowed}
.tool:focus-visible{outline:3px solid #fff}
.c-move{background:#20B2E8;color:#04233A}
.c-turn{background:#9A87FF;color:#150B45}
.c-loop{background:#FFAA2B;color:#3A2100}
.c-cond{background:#6FE08A;color:#06361A}
.c-while{background:#FF7AA8;color:#44061F}
.meter{display:flex;align-items:center;gap:10px;font-size:14px}
.meter .bg{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.meter .fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--amber));width:0;transition:width .2s}
.meter.full .fill{background:var(--pink)}
.meter.shake{animation:shake .4s}
#progWrap{flex:1;min-height:120px;overflow:auto;border-radius:16px;background:rgba(4,7,34,.55);border:1px solid var(--line);position:relative}
#progWrap.locked{opacity:.9}
#progWrap.locked .x,#progWrap.locked .stp,#progWrap.locked select{pointer-events:none}
.slot{min-height:40px;border-radius:12px;padding:4px 6px;margin:0 8px 8px 16px;background:rgba(10,14,60,.7);border:2px dashed transparent;transition:border-color .12s,box-shadow .12s}
.slot.root{margin:0;background:transparent;padding:10px 10px 90px;min-height:100%;border-radius:0;border:none}
.slot.root.empty::before{content:attr(data-ph);display:block;color:var(--mute);text-align:center;padding:28px 12px;border:2px dashed var(--line);border-radius:14px;font-size:15px}
.slot.active{border-color:var(--cyan);box-shadow:0 0 14px rgba(52,213,255,.45) inset}
.slot.root.active{box-shadow:inset 0 0 0 2px var(--cyan)}
.slot.drop-here{border-color:var(--mint)}
.blk{position:relative;margin:6px 0;border-radius:13px;box-shadow:0 3px 0 rgba(0,0,0,.3);font-weight:600;cursor:grab}
.blk.dragging{opacity:.35}
.blk.drop-before{box-shadow:0 -5px 0 var(--mint),0 3px 0 rgba(0,0,0,.3)}
.blk.drop-after{box-shadow:0 5px 0 var(--mint)}
.blk.running{outline:3px solid #fff;box-shadow:0 0 18px 4px rgba(255,255,255,.75)}
.blk.err{outline:3px solid var(--pink);box-shadow:0 0 18px 4px rgba(255,92,154,.8)}
.bh{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.bh .lab{white-space:nowrap}
.bh .sp{flex:1}
.x{border:none;background:rgba(0,0,0,.2);color:inherit;width:26px;height:26px;border-radius:8px;font-size:18px;line-height:1;padding:0;display:grid;place-items:center}
.x:hover{background:rgba(0,0,0,.4)}
.stp{border:none;background:rgba(0,0,0,.22);color:inherit;width:26px;height:26px;border-radius:8px;font-size:18px;line-height:1;padding:0;font-weight:700}
.stp:hover{background:rgba(0,0,0,.4)}
.cnt{min-width:1.6em;text-align:center;font-size:19px;font-weight:700}
.bh select{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:none;padding:4px 6px;background:rgba(255,255,255,.7);color:#111;max-width:100%}
.res{font-size:13px;padding:1px 8px;border-radius:999px;background:#fff;color:#111;display:none}
.res.t{display:inline-block;background:#fff;color:#067a3a}
.res.f{display:inline-block;background:#fff;color:#b3123f}
.els{padding:2px 10px 4px;font-size:15px}
.bf{height:10px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.run{flex:1 1 170px;font-size:20px;font-weight:700;padding:11px 16px;background:linear-gradient(180deg,#4DFFC0,#17C98A);color:#02261B;border:none;border-radius:16px;box-shadow:0 4px 0 #0A8B60}
.run:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(180deg,#4DFFC0,#17C98A);transform:translateY(-1px)}
.run.stop{background:linear-gradient(180deg,#FF8FB5,#FF4D86);color:#3A0018;box-shadow:0 4px 0 #A31C50}
.spd{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.spd button{border:none;background:transparent;padding:7px 10px;font-size:14px;font-weight:600}
.spd button.on{background:var(--cyan);color:#04233A}
.hintbox{font-size:14px;color:var(--mute)}

/* ---------- หน้าต่างผลลัพธ์ ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,5,24,.72);padding:16px}
.mbox{background:linear-gradient(180deg,#1C2680,#0D1459);border:2px solid var(--line);border-radius:28px;padding:26px 26px 22px;max-width:460px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
.mbox h3{margin:0 0 4px;font-size:34px;font-weight:700}
.mbox p{margin:6px 0;color:var(--mute);font-size:17px}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.bigstars svg{width:68px;height:68px;transform:scale(0)}
.bigstars svg.in{animation:starin .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes starin{to{transform:scale(1)}}
.bigstars svg.in.st-on{filter:drop-shadow(0 0 12px rgba(255,228,92,.9))}
.macts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.macts .btn.primary{background:linear-gradient(180deg,#4DFFC0,#17C98A);color:#02261B;border:none;font-size:19px;font-weight:700;box-shadow:0 4px 0 #0A8B60}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

@media (max-width:980px){
  #play{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  #boardHost{flex:none;height:min(86vw,62vh);min-height:260px}
  #progWrap{min-height:260px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #stars2{animation:none}
}

.mbox.wide{max-width:560px}
.lb{width:100%;border-collapse:collapse;margin:10px 0;text-align:left;font-size:17px}
.lb th{color:var(--mute);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line)}
.lb td{padding:6px 8px;border-bottom:1px solid rgba(160,180,255,.1)}
.lb tr.me td{background:rgba(51,240,176,.16);font-weight:600}
.cfg{width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink)}
.foot a{color:var(--cyan)}

.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600}
.tab.on{background:var(--cyan);color:#04233A;border-color:var(--cyan)}
.medal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;color:#2a1a00}
.medal.m1{background:linear-gradient(135deg,#FFF1A8,#FFB400);box-shadow:0 0 12px rgba(255,200,40,.8)}
.medal.m2{background:linear-gradient(135deg,#F4F7FF,#A9B4D0)}
.medal.m3{background:linear-gradient(135deg,#FFD0A0,#C9803A)}
.lb tr.top td{font-size:20px;font-weight:700;color:var(--crystal)}

/* ---------- ห้องทดลองเงื่อนไข ---------- */
.mbox.lab{max-width:980px;max-height:94vh;overflow:auto;text-align:left;padding:22px 24px}
.mbox.lab h3{text-align:center;font-size:30px}
.mbox.lab h4{margin:16px 0 6px;font-size:18px}
.mbox.lab .sub{text-align:center;margin:2px 0 12px}
.labgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
#labHost{background:rgba(4,7,34,.55);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;place-items:center}
#labBoard{position:relative;display:grid;--cell:40px;user-select:none}
.labctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.labctl .btn{padding:8px 12px;font-size:15px}
.cell.s-ok::after,.cell.s-no::after{position:absolute;inset:0;z-index:4;display:grid;place-items:center;font-weight:700;font-size:calc(var(--cell)*.55);text-shadow:0 0 6px #000,0 0 10px currentColor;pointer-events:none}
.cell.s-ok::after{content:"\2713";color:var(--mint)}
.cell.s-no::after{content:"\2715";color:var(--pink)}
.cell.hl{outline:3px solid var(--amber);outline-offset:-3px;border-radius:8px;animation:hlp .8s ease-in-out infinite alternate;z-index:3}
@keyframes hlp{from{box-shadow:0 0 0 rgba(255,185,56,0)}to{box-shadow:0 0 14px rgba(255,185,56,.9)}}
#labConds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.07);border:2px solid transparent;border-radius:12px;padding:7px 12px;font-size:16px;font-weight:600}
.crow:hover{background:rgba(255,255,255,.13)}
.crow.sel{border-color:var(--amber);background:rgba(255,185,56,.12)}
.crow .lab{flex:1}
.lamp{width:18px;height:18px;border-radius:50%;background:#555;flex:none}
.crow.t .lamp{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.crow.f .lamp{background:var(--pink);box-shadow:0 0 8px rgba(255,92,154,.7)}
.crow .tf{min-width:3em;text-align:right;font-size:14px}
.crow.t .tf{color:var(--mint)} .crow.f .tf{color:var(--pink)}
#labExplain{margin-top:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
#labExplain b{color:var(--amber)}
.labpre{display:flex;flex-wrap:wrap;gap:8px}
.labpre .btn{font-size:15px;padding:7px 12px}
.blkinfo{font-size:14px;color:var(--mute);margin:4px 0 8px;display:grid;gap:2px}
.blkinfo b{color:var(--ink)}
#labCode{margin-top:10px;background:rgba(4,7,34,.55);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15px;min-height:40px}
.pl{display:flex;align-items:center;gap:8px;padding:2px 8px;border-radius:8px;border-left:4px solid transparent}
.pl.on{background:rgba(255,255,255,.16);border-left-color:#fff;font-weight:600}
.pl .rs{font-size:12px;padding:0 8px;border-radius:999px;background:#fff;color:#111;display:none}
.pl .rs.t{display:inline-block;color:#067a3a} .pl .rs.f{display:inline-block;color:#b3123f}
#labMsg{margin-top:8px;min-height:44px;font-size:15px;color:var(--ink)}
@media (max-width:820px){.labgrid{grid-template-columns:1fr}}

.mbox.wide,.mbox.lab{max-height:94vh;overflow:auto;padding-top:0}
.mtop{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:14px 0 10px;background:linear-gradient(180deg,#1B2580 82%,rgba(27,37,128,0))}
.mtop h3{flex:1;margin:0;text-align:center;font-size:26px}
.mtop .btn{padding:7px 14px;font-size:16px}
.mtop .btn.icon{font-size:24px;line-height:1;padding:4px 14px}
@media (max-height:720px){
  .lb{font-size:15px}.lb td,.lb th{padding:3px 8px}.lb tr.top td{font-size:17px}
  .medal{width:26px;height:26px}.tabs{margin:4px 0}
}

.namehint{font-size:13px;color:var(--amber);max-width:260px;line-height:1.35}
.namehint:empty{display:none}
.pilot input.need{animation:needp .5s ease-in-out 2;border-color:var(--amber)}
@keyframes needp{50%{box-shadow:0 0 0 4px rgba(255,185,56,.55)}}

.pilot input+.namehint+label{margin-top:2px}
.tab.off{opacity:.45;cursor:not-allowed}
.lb .rm{color:var(--mute);font-weight:400;font-size:13px;margin-left:4px}
#soundBtn .sl{font-size:14px}

.lvl.locked{opacity:.5;cursor:not-allowed;background:rgba(255,255,255,.03)}
.lvl.locked:hover{transform:none;border-color:var(--line);background:rgba(255,255,255,.03)}
.lvl .lk{width:16px;height:16px;color:var(--mute)}
.lvl.next{border-color:var(--tc);box-shadow:0 0 0 0 var(--tc);animation:nextp 1.6s ease-in-out infinite}
@keyframes nextp{50%{box-shadow:0 0 14px 2px var(--tc)}}

<script>
/* ครู: วาง URL ของ Web App (Google Apps Script) ระหว่างเครื่องหมายคำพูดด้านล่าง แล้วบันทึกไฟล์ก่อนก๊อปไปทุกเครื่อง */
window.ROBOT_CONFIG = { scoreUrl: "https://script.google.com/macros/s/AKfycbxMl89hjswfPi2KqQZhb52ctJgV_LRnErCENziV-Zma0CsFmoJEY-HXlWSWD2hWayJ6/exec" };

<script>
/* ภารกิจหุ่นยนต์เก็บพลังงาน — core: ด่าน, ตัวสร้างเขาวงกต, ตัวแปลโปรแกรม */
(function (root) {
  'use strict';

  var DIRS = [{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }]; // N E S W
  var MOVE_DIR = { U: 0, R: 1, D: 2, L: 3 };
  var MAX_EXEC = 9000;

  var COND = {
    frontClear: 'ข้างหน้าว่าง',
    wallAhead: 'ข้างหน้าเป็นกำแพง',
    leftClear: 'ด้านซ้ายว่าง',
    rightClear: 'ด้านขวาว่าง',
    wallLeft: 'ด้านซ้ายเป็นกำแพง',
    wallRight: 'ด้านขวาเป็นกำแพง',
    notDone: 'ภารกิจยังไม่สำเร็จ'
  };

  /* ---------- สุ่มแบบกำหนด seed ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- แผนที่จาก ASCII ----------
     # หิน  . พื้น  S จุดเริ่ม  G ยาน  Z จุดเริ่ม+ยาน  E คริสตัล  X หลุมดำ */
  function parseGrid(rows, dir) {
    var h = rows.length, w = rows[0].length, grid = [], energy = [], start = null, goal = null;
    for (var y = 0; y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) {
        var ch = rows[y].charAt(x), t = 0;
        if (ch === '#') t = 1;
        else if (ch === 'X') t = 2;
        else if (ch === 'E') energy.push({ x: x, y: y });
        if (ch === 'S' || ch === 'Z') start = { x: x, y: y, d: dir == null ? 1 : dir };
        if (ch === 'G' || ch === 'Z') goal = { x: x, y: y };
        row.push(t);
      }
      grid.push(row);
    }
    return { w: w, h: h, grid: grid, energy: energy, start: start, goal: goal };
  }

  function bfsDist(g, sx, sy) {
    var H = g.length, W = g[0].length, d = [], y, x;
    for (y = 0; y < H; y++) { d.push([]); for (x = 0; x < W; x++) d[y].push(-1); }
    var q = [[sx, sy]]; d[sy][sx] = 0;
    for (var i = 0; i < q.length; i++) {
      var c = q[i];
      for (var k = 0; k < 4; k++) {
        var nx = c[0] + DIRS[k].dx, ny = c[1] + DIRS[k].dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H && g[ny][nx] !== 1 && d[ny][nx] < 0) {
          d[ny][nx] = d[c[1]][c[0]] + 1; q.push([nx, ny]);
        }
      }
    }
    return d;
  }

  /* ---------- เขาวงกตสุ่ม (perfect maze) ---------- */
  function shuffle(arr, rnd) {
    for (var j = arr.length - 1; j > 0; j--) { var r = Math.floor(rnd() * (j + 1)), t = arr[j]; arr[j] = arr[r]; arr[r] = t; }
    return arr;
  }
  function makeMaze(n, seed, energyCount, randomStart) {
    var W = 2 * n + 1, H = 2 * n + 1, rnd = mulberry32(seed), g = [], x, y, k;
    for (y = 0; y < H; y++) { g.push([]); for (x = 0; x < W; x++) g[y].push(1); }
    var stack = [[1, 1]]; g[1][1] = 0;
    var steps = [[0, -2], [2, 0], [0, 2], [-2, 0]];
    while (stack.length) {
      var c = stack[stack.length - 1], opts = [];
      for (var i = 0; i < 4; i++) {
        var nx = c[0] + steps[i][0], ny = c[1] + steps[i][1];
        if (nx > 0 && ny > 0 && nx < W - 1 && ny < H - 1 && g[ny][nx] === 1) opts.push(steps[i]);
      }
      if (!opts.length) { stack.pop(); continue; }
      var s = opts[Math.floor(rnd() * opts.length)];
      g[c[1] + s[1] / 2][c[0] + s[0] / 2] = 0;
      g[c[1] + s[1]][c[0] + s[0]] = 0;
      stack.push([c[0] + s[0], c[1] + s[1]]);
    }
    var sx = 1, sy = 1;
    if (randomStart) { sx = 1 + 2 * Math.floor(rnd() * n); sy = 1 + 2 * Math.floor(rnd() * n); }
    var dist = bfsDist(g, sx, sy), best = -1, gx = sx, gy = sy;
    for (y = 1; y < H; y += 2) for (x = 1; x < W; x += 2) if (dist[y][x] > best) { best = dist[y][x]; gx = x; gy = y; }
    var sd;
    if (!randomStart) sd = g[1][2] === 0 ? 1 : 2;
    else {
      var ds = [];
      for (k = 0; k < 4; k++) if (g[sy + DIRS[k].dy][sx + DIRS[k].dx] === 0) ds.push(k);
      sd = ds[Math.floor(rnd() * ds.length)];
    }
    var dead = [];
    for (y = 1; y < H; y += 2) for (x = 1; x < W; x += 2) {
      if ((x === sx && y === sy) || (x === gx && y === gy)) continue;
      var open = 0;
      for (k = 0; k < 4; k++) if (g[y + DIRS[k].dy][x + DIRS[k].dx] === 0) open++;
      if (open === 1) dead.push({ x: x, y: y });
    }
    shuffle(dead, rnd);
    var want = energyCount || 0, pick = dead.slice(0, want);
    if (pick.length < want) {
      var used = {}, others = [];
      for (var u = 0; u < pick.length; u++) used[pick[u].x + ',' + pick[u].y] = true;
      for (y = 1; y < H; y += 2) for (x = 1; x < W; x += 2) {
        if ((x === sx && y === sy) || (x === gx && y === gy) || used[x + ',' + y]) continue;
        others.push({ x: x, y: y });
      }
      shuffle(others, rnd);
      pick = pick.concat(others.slice(0, want - pick.length));
    }
    return { w: W, h: H, grid: g, energy: pick, start: { x: sx, y: sy, d: sd }, goal: { x: gx, y: gy }, seed: seed };
  }

  /* ทางเดินคดเคี้ยวเส้นเดียว (ไม่มีทางแยก): เอาเส้นทางจากจุดเริ่มถึงยานของเขาวงกต แล้วถมที่เหลือเป็นกำแพง */
  function makePath(n, seed, energyCount) {
    var m = makeMaze(n, seed, 0), W = m.w, H = m.h, x, y, k, rnd = mulberry32(seed ^ 0x9e3779b9);
    var par = {}, seen = {}, q = [[m.start.x, m.start.y]];
    seen[m.start.x + ',' + m.start.y] = true;
    for (var i = 0; i < q.length; i++) {
      var c = q[i];
      for (k = 0; k < 4; k++) {
        var nx = c[0] + DIRS[k].dx, ny = c[1] + DIRS[k].dy, key = nx + ',' + ny;
        if (m.grid[ny][nx] === 0 && !seen[key]) { seen[key] = true; par[key] = c[0] + ',' + c[1]; q.push([nx, ny]); }
      }
    }
    var path = [], cu = m.goal.x + ',' + m.goal.y;
    while (cu) { var p = cu.split(',').map(Number); path.push(p); cu = par[cu]; }
    path.reverse();
    var g = [];
    for (y = 0; y < H; y++) { g.push([]); for (x = 0; x < W; x++) g[y].push(1); }
    path.forEach(function (p2) { g[p2[1]][p2[0]] = 0; });
    var cand = path.filter(function (p3, idx) { return p3[0] % 2 === 1 && p3[1] % 2 === 1 && idx > 0 && idx < path.length - 1; });
    shuffle(cand, rnd);
    var d0 = 1;
    for (k = 0; k < 4; k++) if (path[1][0] === path[0][0] + DIRS[k].dx && path[1][1] === path[0][1] + DIRS[k].dy) d0 = k;
    return { w: W, h: H, grid: g, energy: cand.slice(0, energyCount || 0).map(function (p4) { return { x: p4[0], y: p4[1] }; }),
      start: { x: m.start.x, y: m.start.y, d: d0 }, goal: { x: m.goal.x, y: m.goal.y }, seed: seed };
  }

  /* สนามสี่เหลี่ยมโล่ง ๆ ขนาดสุ่ม: เริ่ม/จบที่มุมซ้ายบน คริสตัลอยู่อีกสามมุม */
  function makeRoom(seed) {
    var rnd = mulberry32(seed), rw = 4 + Math.floor(rnd() * 5), rh = 3 + Math.floor(rnd() * 4), W = rw + 2, H = rh + 2, g = [], x, y;
    for (y = 0; y < H; y++) { g.push([]); for (x = 0; x < W; x++) g[y].push(x === 0 || y === 0 || x === W - 1 || y === H - 1 ? 1 : 0); }
    return { w: W, h: H, grid: g, energy: [{ x: rw, y: 1 }, { x: rw, y: rh }, { x: 1, y: rh }],
      start: { x: 1, y: 1, d: 1 }, goal: { x: 1, y: 1 }, seed: seed };
  }

  /* ทางเดินตรงยาวไม่เท่ากัน: เริ่ม/จบที่ปลายซ้าย คริสตัลอยู่ปลายขวา */
  function makeLine(seed) {
    var rnd = mulberry32(seed), L = 5 + Math.floor(rnd() * 8), W = L + 2, H = 3, g = [], x, y;
    for (y = 0; y < H; y++) { g.push([]); for (x = 0; x < W; x++) g[y].push(y === 1 && x >= 1 && x <= L ? 0 : 1); }
    return { w: W, h: H, grid: g, energy: [{ x: L, y: 1 }], start: { x: 1, y: 1, d: 1 }, goal: { x: 1, y: 1 }, seed: seed };
  }

  /* ดาวสี่แฉก: แขนสี่ทิศยาว 1-4 ช่อง คริสตัลอยู่ปลายแขน เริ่ม/จบตรงกลาง */
  function makeStar(seed) {
    var rnd = mulberry32(seed), S = 9, c = 4, g = [], x, y, k;
    for (y = 0; y < S; y++) { g.push([]); for (x = 0; x < S; x++) g[y].push(1); }
    g[c][c] = 0;
    var en = [];
    for (k = 0; k < 4; k++) {
      var len = 1 + Math.floor(rnd() * 4);
      for (var j = 1; j <= len; j++) g[c + DIRS[k].dy * j][c + DIRS[k].dx * j] = 0;
      en.push({ x: c + DIRS[k].dx * len, y: c + DIRS[k].dy * len });
    }
    return { w: S, h: S, grid: g, energy: en, start: { x: c, y: c, d: 0 }, goal: { x: c, y: c }, seed: seed };
  }

  function buildMap(spec, seed) {
    switch (spec.kind) {
      case 'path': return makePath(spec.n, seed, spec.energy || 0);
      case 'room': return makeRoom(seed);
      case 'line': return makeLine(seed);
      case 'star': return makeStar(seed);
      default: return makeMaze(spec.n, seed, spec.energy || 0, !!spec.randomStart);
    }
  }

  /* ---------- ค่าที่ดีที่สุดสำหรับด่านเดินทีละช่อง (BFS) ---------- */
  function bfsPar(map) {
    var e = map.energy.length, idx = {}, i;
    for (i = 0; i < e; i++) idx[map.energy[i].x + ',' + map.energy[i].y] = i;
    var full = (1 << e) - 1, S = 1 << e;
    var seen = new Uint8Array(map.w * map.h * S);
    var q = [[map.start.x, map.start.y, 0, 0]];
    seen[(map.start.y * map.w + map.start.x) * S] = 1;
    for (var h = 0; h < q.length; h++) {
      var c = q[h];
      if (c[0] === map.goal.x && c[1] === map.goal.y && c[2] === full) return c[3];
      for (var k = 0; k < 4; k++) {
        var nx = c[0] + DIRS[k].dx, ny = c[1] + DIRS[k].dy;
        if (nx < 0 || ny < 0 || nx >= map.w || ny >= map.h || map.grid[ny][nx] !== 0) continue;
        var m = c[2], key = nx + ',' + ny;
        if (idx[key] !== undefined) m |= 1 << idx[key];
        var id = (ny * map.w + nx) * S + m;
        if (!seen[id]) { seen[id] = 1; q.push([nx, ny, m, c[3] + 1]); }
      }
    }
    return -1;
  }

  function countBlocks(nodes) {
    var n = 0;
    for (var i = 0; i < nodes.length; i++) {
      n += 1;
      if (nodes[i].body) n += countBlocks(nodes[i].body);
      if (nodes[i].els) n += countBlocks(nodes[i].els);
    }

  /* ---------- ตัวแปลโปรแกรม (generator ให้ UI เล่นทีละก้าว) ---------- */
  function newState(map) {
    var left = {}, c = 0;
    for (var i = 0; i < map.energy.length; i++) { left[map.energy[i].x + ',' + map.energy[i].y] = true; c++; }
    return { x: map.start.x, y: map.start.y, d: map.start.d, left: left, leftCount: c, done: null, count: 0, moves: 0 };
  }
  function isFree(map, x, y) { return x >= 0 && y >= 0 && x < map.w && y < map.h && map.grid[y][x] !== 1; }
  function complete(map, st) { return st.x === map.goal.x && st.y === map.goal.y && st.leftCount === 0; }

  function evalCond(name, map, st) {
    var d = st.d;
    function free(dd) { return isFree(map, st.x + DIRS[dd].dx, st.y + DIRS[dd].dy); }
    switch (name) {
      case 'frontClear': return free(d);
      case 'wallAhead': return !free(d);
      case 'leftClear': return free((d + 3) % 4);
      case 'rightClear': return free((d + 1) % 4);
      case 'wallLeft': return !free((d + 3) % 4);
      case 'wallRight': return !free((d + 1) % 4);
      case 'notDone': return !complete(map, st);
    }
    return false;
  }

  function doCmd(n, map, st) {
    var ev = { k: 'cmd', node: n, collected: null, crash: false, hole: false, turn: 0 };
    if (n.t === 'left') { st.d = (st.d + 3) % 4; ev.turn = -1; }
    else if (n.t === 'right') { st.d = (st.d + 1) % 4; ev.turn = 1; }
    else {
      if (n.t === 'move') st.d = MOVE_DIR[n.dir];
      var nx = st.x + DIRS[st.d].dx, ny = st.y + DIRS[st.d].dy;
      if (!isFree(map, nx, ny)) { st.done = 'crash'; ev.crash = true; }
      else {
        st.x = nx; st.y = ny; st.moves++;
        var key = nx + ',' + ny;
        if (st.left[key]) { delete st.left[key]; st.leftCount--; ev.collected = key; }
        if (map.grid[ny][nx] === 2) { st.done = 'hole'; ev.hole = true; }
        else if (complete(map, st)) st.done = 'win';
      }
    }
    ev.x = st.x; ev.y = st.y; ev.d = st.d;
    return ev;
  }

  function* block(nodes, map, st) {
    for (var i = 0; i < nodes.length; i++) {
      yield* node(nodes[i], map, st);
      if (st.done) return;
    }
  }
  function* node(n, map, st) {
    if (++st.count > MAX_EXEC) { st.done = 'loop'; return; }
    var r;
    switch (n.t) {
      case 'move': case 'fwd': case 'left': case 'right':
        yield doCmd(n, map, st); return;
      case 'repeat':
        for (var i = 0; i < n.n; i++) {
          yield { k: 'enter', node: n };
          yield* block(n.body, map, st);
          if (st.done) return;
          if (++st.count > MAX_EXEC) { st.done = 'loop'; return; }
        }
        return;
      case 'if':
        r = evalCond(n.c, map, st);
        yield { k: 'cond', node: n, result: r };
        yield* block(r ? n.body : (n.els || []), map, st);
        return;
      case 'while':
        while (true) {
          if (++st.count > MAX_EXEC) { st.done = 'loop'; return; }
          r = evalCond(n.c, map, st);
          yield { k: 'cond', node: n, result: r };
          if (!r) return;
          yield* block(n.body, map, st);
          if (st.done) return;
        }
    }
  }
  function* run(nodes, map, st) {
    yield* block(nodes, map, st);
    if (!st.done) st.done = 'end';
  }
  function simulate(program, map) {
    var st = newState(map), g = run(program, map, st);

  function threeLimit(par, tier) { return par + (tier === 'medium' || tier === 'hard' ? 2 : 0); }
  function stars(blocks, par, tier) {
    if (blocks <= threeLimit(par, tier)) return 3;
    var two = tier === 'easy' ? Math.max(2, Math.ceil(par * 0.35)) : Math.max(4, Math.ceil(par * 0.8));
    return blocks <= par + two ? 2 : 1;
  }

  function N(t, extra) { var o = { t: t }; for (var k in extra) o[k] = extra[k]; return o; }
  var fwd = function () { return N('fwd'); }, lft = function () { return N('left'); }, rgt = function () { return N('right'); };

  var iff = function (c, body, els) { return N('if', { c: c, body: body, els: els || [], hasElse: !!els }); };

  function leftHand() {
    return [whl('notDone', [
      iff('leftClear', [lft()]),
      iff('frontClear', [fwd()], [rgt()])
    ])];
  }

    return [whl('notDone', [iff('frontClear', [fwd()], [iff('leftClear', [lft()], [rgt()])])])];

  function lineWalk() { return [whl('notDone', [iff('frontClear', [fwd()], [lft(), lft()])])]; }

  /* ---------- ค้นหา/ลบ/ย้ายบล็อก ---------- */

  function runProgram() {
    if (cur.running) { // หยุด
      cur.token++; cur.running = false; setRunningUI(false); mark(null);

    }
    audio();

      '<div><p style="margin:0 0 6px">กดที่เงื่อนไขเพื่อดูว่ามันตรวจช่องไหน (ช่องส้มกะพริบ)</p><ul id="labConds"></ul><div id="labExplain"></div></div></div>' +
      '<h4>ดูโปรแกรมตัวอย่างทำงาน</h4>' +
      '<div class="blkinfo"><span><b>ถ้า</b> เงื่อนไขจริง → ทำบล็อกข้างใน เท็จ → ข้ามไป</span><span><b>ถ้า…ไม่งั้น</b> จริง → ทำข้างใน เท็จ → ทำส่วนไม่งั้นแทน</span><span><b>วนซ้ำขณะที่</b> ตรวจก่อนทุกรอบ จริง → ทำต่อ เท็จ → ออกจากลูป</span></div>' +
      '<div class="labpre" id="labPre"></div><div id="labCode"></div><div id="labMsg" aria-live="polite"></div>' +
      '<div class="macts"><button class="btn" id="labClose" type="button">ปิด</button></div></div>';
    var ul = $('labConds');
    Object.keys(C.COND).forEach(function (k) {
      var li = h('li'), b = h('button', 'crow', '<span class="lamp"></span><span class="lab">' + esc(C.COND[k]) + '</span><span class="tf"></span>');
      b.type = 'button'; b.dataset.c = k; b.onclick = function () { lab.sel = k; labSense(); };
      li.appendChild(b); ul.appendChild(li);
    });
    var pre = $('labPre');
    LAB_PRESETS.forEach(function (p) { var b = h('button', 'btn', esc(p.name)); b.type = 'button'; b.title = p.desc; b.onclick = function () { labRun(p); }; pre.appendChild(b); });
    $('lbF').onclick = function () { labDo('fwd'); }; $('lbL').onclick = function () { labDo('left'); }; $('lbR').onclick = function () { labDo('right'); };
    $('lbX').onclick = function () { lab.token++; lab.busy = false; $('labCode').innerHTML = ''; $('labMsg').textContent = ''; labBuild(); };
    $('labClose').onclick = closeModal; bindClose(m); $('labClose').focus();
    lab.token++; lab.busy = false; lab.sel = 'frontClear'; labBuild();
  }

  /* ---------- เชื่อมปุ่ม ---------- */
  $('backBtn').onclick = goHome;
  $('labBtn').onclick = showLab;
  $('boardBtn').onclick = showBoard; $('cfgBtn').onclick = showConfig;
  $('runBtn').onclick = runProgram;
  $('undoBtn').onclick = undo;
  $('clearBtn').onclick = clearAll;
  $('resetBtn').onclick = function () { resetBoardOnly(); say(cur.level.story, ''); };
  $('shuffleBtn').onclick = function () { if (cur.running) return; prepareMaps(cur.level, true); resetBoardOnly(); say('สุ่มแผนที่ใหม่แล้ว! โปรแกรมของคุณยังผ่านไหมนะ?', ''); };
  $('hintBtn').onclick = function () {
    var hs = cur.level.hints || []; if (!hs.length) return;
    $('hintText').textContent = 'ใบ้ ' + (cur.hintIdx + 1) + '/' + hs.length + ': ' + hs[cur.hintIdx];
    cur.hintIdx = (cur.hintIdx + 1) % hs.length;
  };
  function paintSound() { $('soundBtn').innerHTML = ic(soundOn ? 'sound' : 'mute') + ' <span class="sl">' + (soundOn ? 'เสียงเปิด' : 'เสียงปิด') + '</span>'; $('soundBtn').title = soundOn ? 'ปิดเสียง' : 'เปิดเสียง'; }
  $('soundBtn').onclick = function () { soundOn = !soundOn; paintSound(); if (soundOn) { audio(); playSfx('click'); } };
  $('playerName').addEventListener('input', function (e) { store.name = e.target.value.slice(0, 30); if (store.name.trim()) $('nameHint').textContent = ''; });
  $('newPlayerBtn').onclick = newPlayer;
  $('playerName').addEventListener('change', loadPlayer);
  $('playerRoom').addEventListener('change', loadPlayer);
  $('playerRoom').addEventListener('input', function (e) { store.room = e.target.value.slice(0, 12); save(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal(); });
  $('progWrap').addEventListener('click', function (e) {
    if (cur.running) return;
    if (e.target === $('progWrap') || e.target === $('program')) { cur.active = cur.program; renderProgram(); updateCounters(); }
  });

  // ไอคอนปุ่มคงที่
  $('backBtn').innerHTML = ic('back') + ' เมนู';
  $('undoBtn').innerHTML = ic('undo') + ' ย้อนกลับ';
  $('clearBtn').innerHTML = ic('trash') + ' ล้าง';
  $('resetBtn').innerHTML = ic('reset') + ' วางโบโบ้ใหม่';
  $('shuffleBtn').innerHTML = ic('shuffle') + ' สุ่มแผนที่ใหม่';
  $('hintBtn').innerHTML = ic('bulb') + ' ใบ้';
  $('labBtn').innerHTML = ic('q') + ' วิธีใช้เงื่อนไข';
  paintSound();
  $('totIcon').innerHTML = starSvg(true);

  renderHome(); showScreen('home'); updateSync(); flush();

  // สำหรับทดสอบ
  window.__game = { isUnlocked: isUnlocked, loadPlayer: loadPlayer, lab: lab, showLab: showLab, cur: cur, startLevel: startLevel, addTool: addTool, runProgram: runProgram, store: store };
})();

</script>
</body>
</html>
